name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual re-deploy of the docs site without a new commit

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra web --extra ddg
      - name: Ruff
        run: uv run ruff check lovia tests
      - name: Mypy (strict)
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra web --extra ddg
      - name: Pytest
        run: uv run pytest

  # Type-check the bundled web UI (lovia/web/static/js) with TypeScript's
  # checkJs. No build step and no npm packages in the repo — a hand-written
  # jsconfig.json + types.d.ts drive it, and tsc is pinned via npx so the check
  # is reproducible. Deliberately lenient (not `strict`): it catches typos, wrong
  # property names, bad argument counts, and refactor drift without demanding
  # casts on every DOM access. See lovia/web/static/jsconfig.json.
  typecheck-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Type-check (tsc --checkJs)
        run: npx --yes --package typescript@7.0.2 tsc --noEmit -p lovia/web/static/jsconfig.json

  # Validate the docs build on pull requests so broken links and anchors are
  # caught before merge. No deployment here (that is the `docs` job below), so
  # this stays off the github-pages environment and its branch policy.
  docs-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        # Extras back the modules that doc snippets import (lovia.web, .plugins.mcp,
        # .tools.search); the snippet checker imports them for real to verify symbols.
        run: uv sync --extra docs --extra mcp --extra web --extra ddg
      - name: Build site (strict)
        run: uv run mkdocs build --strict
      - name: Check links, anchors, and snippets
        run: uv run python scripts/check_docs.py

  # Build the MkDocs site and upload it as the Pages artifact. Split from the
  # deploy job so a failed deploy can be re-run on its own without re-uploading
  # a second `github-pages` artifact (which makes deploy-pages fail with
  # "Multiple artifacts named github-pages"). Runs on main pushes and on manual
  # dispatch; PR validation is handled by `docs-check` above.
  docs:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        # Extras back the modules that doc snippets import (lovia.web, .plugins.mcp,
        # .tools.search); the snippet checker imports them for real to verify symbols.
        run: uv sync --extra docs --extra mcp --extra web --extra ddg
      - name: Build site (strict)
        run: uv run mkdocs build --strict
      - name: Check links, anchors, and snippets
        run: uv run python scripts/check_docs.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publish the uploaded artifact to GitHub Pages. Isolated so re-running only
  # this job never produces a duplicate artifact. The github-pages environment's
  # branch policy rejects non-main refs, so it inherits the gating via `needs`.
  deploy:
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Only the latest docs build matters, so cancel any queued/in-flight deploy
    # rather than letting back-to-back pushes race in the Pages backend (which
    # surfaces as a flaky "Deployment failed, try again later").
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # Publish to PyPI when a main push carries a version not yet released —
  # merging a version-bump PR IS the release, matching how this repo already
  # works (every release PR bumps pyproject/__init__/uv.lock). Pushes without
  # a bump skip quietly, so docs/chore commits stay silent. Idempotent: the
  # PyPI existence gate makes re-runs and manual dispatches safe, and a flaked
  # gate can at worst hit PyPI's own duplicate-file rejection. Auth is trusted
  # publishing (OIDC via id-token, configured on PyPI for ci.yml + the `pypi`
  # environment) — no long-lived token secret. After a successful upload the
  # job tags the release commit and creates a GitHub Release so versions get
  # bisect/diff anchors without any manual tagging ritual.
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [lint, test, typecheck-web]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lovia/${{ steps.ver.outputs.version }}/
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
      contents: write # tag + GitHub Release after upload
    # Queue back-to-back merges instead of cancelling — every bumped version
    # should ship, and the existence gate keeps a queued duplicate harmless.
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Skip if already on PyPI
        id: gate
        # The version-specific JSON URL is uncached (the aggregate one lags
        # behind a CDN), so 200 here is authoritative.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/lovia/${{ steps.ver.outputs.version }}/json")
          echo "publish=$([ "$code" != "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "v${{ steps.ver.outputs.version }} on PyPI: HTTP $code"
      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.publish == 'true'
      - name: Build sdist + wheel
        if: steps.gate.outputs.publish == 'true'
        run: uv build
      - name: Twine check
        if: steps.gate.outputs.publish == 'true'
        run: uvx twine check dist/*
      - name: Publish to PyPI
        if: steps.gate.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Verify on PyPI
        if: steps.gate.outputs.publish == 'true'
        run: |
          for i in $(seq 1 10); do
            curl -sf "https://pypi.org/pypi/lovia/${{ steps.ver.outputs.version }}/json" >/dev/null && exit 0
            sleep 5
          done
          echo "v${{ steps.ver.outputs.version }} not visible on PyPI after 50s" && exit 1
      - name: Tag + GitHub Release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" dist/* \
            --title "v${{ steps.ver.outputs.version }}" --generate-notes
